<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — English Booster</title>
  <meta name="description" content="Log in to your English Booster account and start practicing speaking English.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg">
  <!-- PWA & MULTI-DEVICE SUPPORT (MOBILE, TABLETTE, ORDINATEUR) -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#030712">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="English Booster">
  <link rel="apple-touch-icon" href="../assets/images/logo.svg">
</head>
<body>

  <!-- CRYSTAL BACKGROUND -->
  <div class="crystal-bg-wrapper" aria-hidden="true">
    <div class="crystal-orb crystal-orb-1"></div>
    <div class="crystal-orb crystal-orb-2"></div>
    <div class="crystal-grid-overlay"></div>
  </div>

  <header>
    <nav class="site-nav scrolled" style="position: relative;">
      <div class="container nav-container">
        <a href="../index.html" class="nav-brand">
          <img src="../assets/images/logo.svg" alt="English Booster Logo" class="brand-logo-img" />
          <span>ENGLISH <span class="brand-title-accent">BOOSTER</span></span>
        </a>
        <div class="nav-actions">
          <!-- Language Switcher Pill (Multi-Langue Anglais & Français) -->
          <div class="lang-switcher-pill" role="group" aria-label="Language Selector">
            <button type="button" class="lang-btn active" data-lang="en" title="English">
              <span>🇬🇧</span> EN
            </button>
            <button type="button" class="lang-btn" data-lang="fr" title="Français">
              <span>🇫🇷</span> FR
            </button>
          </div>
          <button class="theme-toggle-btn" aria-label="Toggle Theme">☀️</button>
          <span style="font-size: 0.9rem; color: var(--text-muted);">New here?</span>
          <a href="register.html" class="btn btn-primary btn-sm">Get Started</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="auth-wrapper">
    <div class="glass-card auth-card reveal-init" style="max-width: 480px;">
      <div class="auth-header">
        <span class="crystal-badge" style="margin-bottom: 12px;">Welcome Back</span>
        <h1 style="font-size: 2.2rem; letter-spacing: -0.02em;">Log into English Booster</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 6px;">
          Pick up where you left off and keep your daily streak alive.
        </p>
      </div>

      <!-- Quick 1-Click Demo Logins for Fast Review -->
      <div style="background: rgba(74, 222, 128, 0.08); border: 1px solid rgba(74, 222, 128, 0.25); border-radius: var(--radius-md); padding: 14px; margin-bottom: 24px;">
        <div style="font-size: 0.8rem; font-weight: 700; color: var(--cyan-primary); text-transform: uppercase; margin-bottom: 8px;">
          ⚡ 1-Click Demo Profiles (Instant Access)
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <button type="button" class="btn btn-secondary btn-sm btn-demo-login" data-demo-user="sofia" style="justify-content: flex-start; text-align: left; width: 100%;">
            <span>🇪🇸</span> <strong>Sofia Martínez</strong> <span class="badge-level level-b1" style="margin-left: auto;">B1 Intermediate</span>
          </button>
          <button type="button" class="btn btn-secondary btn-sm btn-demo-login" data-demo-user="tychique" style="justify-content: flex-start; text-align: left; width: 100%;">
            <span>🇨🇮</span> <strong>Tychique Bongo</strong> <span class="badge-level level-c2" style="margin-left: auto;">Founder · C2</span>
          </button>
          <button type="button" class="btn btn-secondary btn-sm btn-demo-login" data-demo-user="kenji" style="justify-content: flex-start; text-align: left; width: 100%;">
            <span>🇯🇵</span> <strong>Kenji Sato</strong> <span class="badge-level level-b2" style="margin-left: auto;">B2 Upper</span>
          </button>
        </div>
      </div>

      <!-- Social Logins -->
      <div class="social-auth-grid">
        <button type="button" class="btn btn-secondary btn-social-auth" data-provider="Google">
          <span>🇬</span> Google
        </button>
        <button type="button" class="btn btn-secondary btn-social-auth" data-provider="Apple">
          <span>🍎</span> Apple
        </button>
      </div>

      <div class="auth-divider">or log in with email</div>

      <!-- Form -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="alex@example.com" value="alex.rivera@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <div class="form-label">
            <span>Password</span>
            <a href="#" style="color: var(--cyan-primary); font-size: 0.8rem;">Forgot password?</a>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" value="Password123!" required autocomplete="current-password">
        </div>

        <div class="form-group" style="margin-top: 10px;">
          <label class="custom-checkbox-label">
            <input type="checkbox" checked>
            <span>Remember this device for 30 days</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 14px;">
          Log In to Dashboard
        </button>
      </form>
    </div>
  </main>

  <script src="../js/i18n.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/avatarManager.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/pwa.js"></script>
</body>
</html>
